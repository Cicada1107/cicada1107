<svg viewBox="0 0 900 520" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0d14"/>
      <stop offset="100%" stop-color="#05050a"/>
    </linearGradient>

    <linearGradient id="bezelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#33333f"/>
      <stop offset="55%" stop-color="#202028"/>
      <stop offset="100%" stop-color="#131318"/>
    </linearGradient>

    <linearGradient id="standGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#26262e"/>
      <stop offset="100%" stop-color="#161619"/>
    </linearGradient>

    <radialGradient id="screenGlow" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#0a2e1c"/>
      <stop offset="65%" stop-color="#04140c"/>
      <stop offset="100%" stop-color="#020402"/>
    </radialGradient>

    <linearGradient id="beamGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#39ff9c" stop-opacity="0"/>
      <stop offset="50%" stop-color="#39ff9c" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#39ff9c" stop-opacity="0"/>
    </linearGradient>

    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="transparent"/>
      <line x1="0" y1="0" x2="4" y2="0" stroke="#000000" stroke-opacity="0.35"/>
    </pattern>

    <filter id="textGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="screenClip">
      <rect x="190" y="78" width="520" height="290" rx="8"/>
    </clipPath>

    <clipPath id="clip0"><rect x="212" y="106" width="0" height="20"><animate attributeName="width" from="0" to="330" begin="0.2s" dur="0.7s" fill="freeze"/></rect></clipPath>
    <clipPath id="clip1"><rect x="212" y="138" width="0" height="20"><animate attributeName="width" from="0" to="400" begin="1.1s" dur="0.7s" fill="freeze"/></rect></clipPath>
    <clipPath id="clip2"><rect x="212" y="170" width="0" height="20"><animate attributeName="width" from="0" to="420" begin="2.0s" dur="0.7s" fill="freeze"/></rect></clipPath>
    <clipPath id="clip3"><rect x="212" y="202" width="0" height="20"><animate attributeName="width" from="0" to="380" begin="2.9s" dur="0.7s" fill="freeze"/></rect></clipPath>
    <clipPath id="clip4"><rect x="212" y="234" width="0" height="20"><animate attributeName="width" from="0" to="400" begin="3.8s" dur="0.7s" fill="freeze"/></rect></clipPath>
    <clipPath id="clip5"><rect x="212" y="266" width="0" height="20"><animate attributeName="width" from="0" to="440" begin="4.7s" dur="0.7s" fill="freeze"/></rect></clipPath>
    <clipPath id="clip6"><rect x="212" y="298" width="0" height="20"><animate attributeName="width" from="0" to="260" begin="5.6s" dur="0.6s" fill="freeze"/></rect></clipPath>
  </defs>

  <rect width="900" height="520" fill="url(#bgGrad)"/>

  <!-- stand -->
  <path d="M 400 400 L 500 400 L 530 460 L 370 460 Z" fill="url(#standGrad)"/>
  <rect x="330" y="458" width="240" height="18" rx="6" fill="url(#standGrad)"/>

  <!-- bezel -->
  <rect x="150" y="40" width="600" height="380" rx="26" fill="url(#bezelGrad)" stroke="#6d5cff" stroke-opacity="0.55" stroke-width="2"/>
  <rect x="164" y="54" width="572" height="352" rx="16" fill="#0b0b10"/>

  <!-- screen -->
  <rect x="190" y="78" width="520" height="290" rx="8" fill="url(#screenGlow)"/>

  <g clip-path="url(#screenClip)">
    <!-- static scanline texture -->
    <rect x="190" y="78" width="520" height="290" fill="url(#scanlines)"/>

    <!-- moving scan beam -->
    <rect x="190" y="-140" width="520" height="80" fill="url(#beamGrad)">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,430; 0,0" dur="5s" repeatCount="indefinite"/>
    </rect>

    <!-- boot text, revealed with a typewriter clip -->
    <g fill="#3dffab" font-size="16" filter="url(#textGlow)">
      <text x="212" y="122" clip-path="url(#clip0)">$ arijit@systems:~$ boot</text>
      <text x="212" y="154" clip-path="url(#clip1)">[ok] loading kernel modules...</text>
      <text x="212" y="186" clip-path="url(#clip2)">[ok] initializing container runtime</text>
      <text x="212" y="218" clip-path="url(#clip3)">[ok] mounting overlayfs</text>
      <text x="212" y="250" clip-path="url(#clip4)">[ok] spawning gVisor sandbox</text>
      <text x="212" y="282" clip-path="url(#clip5)">[ok] attaching unikernel runtime</text>
      <text x="212" y="314" clip-path="url(#clip6)">arijit@systems:~$ _</text>
    </g>

    <!-- blinking cursor -->
    <rect x="392" y="300" width="10" height="16" fill="#3dffab" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.001;0.3;0.75;1" begin="6.3s" dur="1s" repeatCount="indefinite"/>
    </rect>

    <!-- subtle flicker overlay -->
    <rect x="190" y="78" width="520" height="290" fill="#000000" opacity="0">
      <animate attributeName="opacity" values="0;0.05;0;0.03;0" dur="0.35s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- screen vignette edge -->
  <rect x="190" y="78" width="520" height="290" rx="8" fill="none" stroke="#000000" stroke-opacity="0.6" stroke-width="10"/>

  <!-- power LED -->
  <circle cx="716" cy="392" r="4" fill="#3dffab">
    <animate attributeName="opacity" values="1;0.25;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="726" y="396" font-size="9" fill="#5a5a66">PWR</text>
</svg>
